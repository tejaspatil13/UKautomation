<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copilot Admin</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1c2430; --text-2: #5b6573; --text-3: #8a93a0;
    --line: #e1e4e9; --line-soft: #eef0f3; --accent: #2357c6; --accent-dark: #1a449e; --accent-soft: #eaf0fc;
    --green: #1d7a46; --green-soft: #e6f4ec; --red: #c0392b; --red-soft: #fdecea; --amber: #8a5300; --amber-soft: #fff3dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .bar { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .tabs { display: flex; height: 100%; gap: 4px; }
  .tabs button { border: 0; background: none; padding: 0 14px; font: inherit; font-weight: 500; color: var(--text-2);
                 cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 8px; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .count { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--line-soft); color: var(--text-2); }
  .updated { margin-left: auto; font-size: 12px; color: var(--text-3); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; display: grid; gap: 14px; }
  .intro { margin: 0 0 4px; color: var(--text-2); }
  .error { padding: 12px 14px; border-radius: 8px; background: var(--red-soft); color: var(--red); }
  #list { display: grid; gap: 12px; }
  .empty { padding: 40px; text-align: center; color: var(--text-3); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }
  .pc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
        display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; }
  .pc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .name { font-weight: 650; font-size: 16px; }
  .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-3); }
  .badge { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
  .b-active { background: var(--green-soft); color: var(--green); }
  .b-paid { background: var(--accent-soft); color: var(--accent); }
  .b-ended { background: var(--red-soft); color: var(--red); }
  .b-blocked { background: #2b2f36; color: #fff; }
  .online { font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; }
  .online i { width: 8px; height: 8px; border-radius: 50%; background: #c3c8d0; display: inline-block; }
  .online.on i { background: #22a35a; box-shadow: 0 0 0 3px #22a35a22; }
  .left { grid-row: span 2; align-self: center; text-align: right; }
  .left strong { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .left span { font-size: 12px; color: var(--text-3); }
  .left.warn strong { color: var(--amber); }
  .left.over strong { color: var(--red); }
  .hint { grid-column: 1 / -1; font-size: 13px; color: var(--amber); background: var(--amber-soft); padding: 6px 10px; border-radius: 6px; }
  .meta { font-size: 13px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line-soft); margin-top: 4px; }
  .actions .gap { flex: 1; }
  button.btn { font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 8px; cursor: pointer;
               border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button.btn:hover { background: var(--line-soft); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.danger { border-color: var(--red); color: var(--red); }
  button.danger:hover { background: var(--red-soft); }
  button.solid-danger { background: var(--red); border-color: var(--red); color: #fff; }
  button.solid-danger:hover { background: #a93226; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dark); }
  button.quiet { border-color: transparent; color: var(--text-2); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1c2430; color: #fff;
           padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 700px) { .pc { grid-template-columns: 1fr; } .left { grid-row: auto; text-align: left; } .bar { gap: 12px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span>Copilot Admin</div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-env="production">Clients <span class="count" id="n-production">–</span></button>
      <button type="button" role="tab" data-env="test">Test PCs <span class="count" id="n-test">–</span></button>
    </nav>
    <span class="updated" id="updated"></span>
  </div>
</header>
<main>
  <p class="intro"><span id="intro"></span> <button type="button" class="btn quiet" id="build-toggle" hidden></button></p>
  <div id="list"></div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="/admin_panel.js"></script>
</body>
</html>
