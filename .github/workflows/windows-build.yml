# Windows desktop build: test → package → self-test the packaged app → publish.
#
#   push to main            → tests, Windows build, then a TEST release (GitHub pre-release, "test" update
#                             channel). Only test builds (your Windows PC) update from it.
#   pull request            → tests and build only; nothing is published.
#   Run workflow → "stable" → the CLIENT release: version from desktop/VERSION, production licence server,
#                             "stable" update channel. Runs in the "production" environment, so it can be
#                             made to wait for your approval (Settings → Environments → production).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables), all public values:
#   LICENSE_URL_TEST, LICENSE_PUBLIC_KEY_TEST, LICENSE_URL_PRODUCTION, LICENSE_PUBLIC_KEY_PRODUCTION
name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "What to publish"
        type: choice
        options: [test, stable]
        default: test

permissions:
  contents: write  # publish GitHub Releases

concurrency:
  group: windows-build-${{ github.ref }}-${{ inputs.release || 'auto' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  VPK_VERSION: "1.2.161"  # same as the velopack Python package (desktop/requirements.txt)

jobs:
  build:
    runs-on: windows-latest
    environment: ${{ inputs.release == 'stable' && 'production' || 'test' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            desktop/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Decide channel and version
        id: plan
        env:
          HAS_TEST_LICENSE: ${{ vars.LICENSE_URL_TEST != '' && vars.LICENSE_PUBLIC_KEY_TEST != '' }}
          HAS_PRODUCTION_LICENSE: ${{ vars.LICENSE_URL_PRODUCTION != '' && vars.LICENSE_PUBLIC_KEY_PRODUCTION != '' }}
        run: |
          $base = (Get-Content desktop/VERSION -Raw).Trim()
          $release = "${{ inputs.release }}"
          if ($release -eq "stable") {
            $channel = "stable"; $version = $base; $publish = "true"
            if (git tag --list "v$version") { throw "v$version was already released. Raise desktop/VERSION first." }
            if ($env:HAS_PRODUCTION_LICENSE -ne "true") { throw "Set LICENSE_URL_PRODUCTION and LICENSE_PUBLIC_KEY_PRODUCTION first (docs/desktop/LICENSING_GUIDE.md)." }
          } else {
            $channel = "test"; $version = "$base-test.${{ github.run_number }}"
            $publish = if ("${{ github.event_name }}" -eq "pull_request") { "false" } else { "true" }
            if ($env:HAS_TEST_LICENSE -ne "true") {
              Write-Warning "No test licence server configured yet: building and testing only, not publishing."
              $publish = "false"
            }
          }
          $suffix = if ($channel -eq "stable") { "PRODUCTION" } else { "TEST" }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "packid=$(if ($channel -eq 'stable') { 'CopilotApp' } else { 'CopilotAppTest' })" >> $env:GITHUB_OUTPUT
          Write-Host "Building $channel $version (publish: $publish)"

      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt -r backend/requirements-dev.txt

      - name: Backend tests (on Windows)
        working-directory: backend
        run: python -m pytest -q

      - name: Desktop tests (on Windows)
        working-directory: desktop
        run: python -m pytest -q

      - name: Prepare build configuration
        env:
          LICENSE_URL: ${{ vars[format('LICENSE_URL_{0}', steps.plan.outputs.suffix)] }}
          LICENSE_KEY: ${{ vars[format('LICENSE_PUBLIC_KEY_{0}', steps.plan.outputs.suffix)] }}
        run: |
          if (-not $env:LICENSE_URL -or -not $env:LICENSE_KEY) {  # unpublished test build: placeholder server
            $env:LICENSE_URL = "https://licence.invalid"; $env:LICENSE_KEY = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          }
          python desktop/prepare_build.py --channel ${{ steps.plan.outputs.channel }} --version ${{ steps.plan.outputs.version }} `
            --license-url $env:LICENSE_URL --license-public-key $env:LICENSE_KEY `
            --update-repo "${{ github.server_url }}/${{ github.repository }}"

      - name: Package with PyInstaller
        run: pyinstaller desktop/copilot.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Self-test the packaged app (no Python involved)
        run: |
          $env:COPILOT_HOME = "$env:RUNNER_TEMP\copilot-selftest"
          $p = Start-Process -FilePath dist\Copilot\Copilot.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:COPILOT_HOME\logs\selftest.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:COPILOT_HOME\logs\copilot.log" -Tail 80 -ErrorAction SilentlyContinue
            throw "Packaged app self-test failed (exit $($p.ExitCode))"
          }

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version $env:VPK_VERSION

      - name: Previous release (for small delta updates)
        if: steps.plan.outputs.publish == 'true'
        continue-on-error: true  # nothing to download before the first release
        run: vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --channel ${{ steps.plan.outputs.channel }} --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Create installer and update packages
        run: |
          vpk pack --packId ${{ steps.plan.outputs.packid }} --packVersion ${{ steps.plan.outputs.version }} `
            --packDir dist\Copilot --mainExe Copilot.exe --packTitle "Copilot" --packAuthors "Copilot" `
            --icon desktop\assets\copilot.ico --channel ${{ steps.plan.outputs.channel }} --framework webview2 --runtime win-x64

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copilot-${{ steps.plan.outputs.channel }}-${{ steps.plan.outputs.version }}
          path: Releases/
          retention-days: 30

      - name: Install, open the real window, second launch (as the user does)
        env:
          UKA_AUTO_IMPORT_ON_START: "false"  # don't download the 4 GB of datasets on the build machine
        run: |
          New-Item -ItemType Directory -Force window-test | Out-Null
          $setup = Get-ChildItem Releases\*-Setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "--silent" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "Setup did not finish within 5 minutes" }
          if ($p.ExitCode -ne 0) { throw "Setup failed (exit $($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\${{ steps.plan.outputs.packid }}\current\Copilot.exe"
          if (-not (Test-Path $exe)) { throw "Copilot.exe was not installed at $exe" }
          $links = Get-ChildItem "$env:USERPROFILE\Desktop", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" `
            -Filter "Copilot*.lnk" -Recurse -ErrorAction SilentlyContinue
          "Shortcuts: $($links.FullName -join ', ')"
          if (-not $links) { throw "No Start menu or desktop shortcut was created" }
          Get-Process Copilot -ErrorAction SilentlyContinue | Stop-Process -Force  # in case Setup started it
          Start-Sleep 2

          $log = "$env:LOCALAPPDATA\Copilot\logs\copilot.log"
          function Read-Log {  # the app keeps the log open: read with sharing, as Notepad does
            try {
              $fs = [IO.File]::Open($log, 'Open', 'Read', 'ReadWrite, Delete')
              try { (New-Object IO.StreamReader($fs)).ReadToEnd() } finally { $fs.Dispose() }
            } catch { "" }
          }
          $app = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and -not $app.HasExited -and
                 (Read-Log) -notmatch "window connected") { Start-Sleep 2 }
          Start-Sleep 10  # let the page render before the screenshot
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\window-test\window.png")

          $second = Start-Process $exe -PassThru  # must hand over to the open window and exit
          $secondExited = $second.WaitForExit(30000)
          Start-Sleep 2
          $alive = -not $app.HasExited
          Get-Process Copilot -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $text = Read-Log
          Set-Content window-test\copilot.log $text
          $text
          $fail = @()
          if (-not $alive) { $fail += "the app closed by itself" }
          if ($text -notmatch "window connected") { $fail += "the window never got past the session check" }
          if ($text -match "refused ") { $fail += "requests from the window were refused" }
          if (-not $secondExited) { $fail += "a second launch did not exit" }
          if ($text -notmatch "come to the front") { $fail += "a second launch did not reach the open window" }
          if ($text -match " ERROR ") { $fail += "errors in copilot.log" }
          if ($fail) { throw "Window test failed: $($fail -join '; ')" }
          "Window test passed"

      - name: Uninstall keeps the data folder
        run: |
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Copilot\data" | Out-Null
          Set-Content "$env:LOCALAPPDATA\Copilot\data\keep.txt" "user data"
          $update = "$env:LOCALAPPDATA\${{ steps.plan.outputs.packid }}\Update.exe"
          $p = Start-Process $update -ArgumentList "uninstall", "--silent" -PassThru
          if (-not $p.WaitForExit(120000)) { throw "Uninstall did not finish within 2 minutes" }
          "Uninstall exit code: $($p.ExitCode)"
          Start-Sleep 3
          if (Test-Path "$env:LOCALAPPDATA\${{ steps.plan.outputs.packid }}\current\Copilot.exe") { throw "The program was not removed" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Copilot\data\keep.txt")) { throw "Uninstall deleted the user's data" }
          "Uninstall passed: program removed, data kept"

      - name: Keep the window test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-test-${{ steps.plan.outputs.version }}
          path: window-test/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.plan.outputs.publish == 'true'
        run: |
          $extra = @()
          if ("${{ steps.plan.outputs.channel }}" -eq "test") { $extra += "--pre" }  # test builds: pre-releases
          vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" `
            --channel ${{ steps.plan.outputs.channel }} --publish @extra `
            --releaseName "Copilot ${{ steps.plan.outputs.version }}" --tag "v${{ steps.plan.outputs.version }}"

      - name: Update test - the previous test release updates itself to this one
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.channel == 'test'
        env:
          UKA_AUTO_IMPORT_ON_START: "false"
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub's rate limit on shared build machines
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $new = "${{ steps.plan.outputs.version }}"
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=30" | ConvertFrom-Json
          $prev = $releases | Where-Object { $_.prerelease -and $_.tag_name -ne "v$new" -and
                                             ($_.assets | Where-Object name -like "*-Setup.exe") } | Select-Object -First 1
          if (-not $prev) { "No earlier test release yet: the update test runs from the next build on."; exit 0 }
          "Installing the previous release $($prev.tag_name), expecting it to update to $new"
          gh release download $prev.tag_name --repo "${{ github.repository }}" --pattern "*-Setup.exe" --dir prev
          $p = Start-Process (Get-ChildItem prev\*-Setup.exe | Select-Object -First 1).FullName -ArgumentList "--silent" -PassThru
          if (-not $p.WaitForExit(300000) -or $p.ExitCode -ne 0) { throw "Installing the previous release failed" }
          Get-Process Copilot -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2

          $root = "$env:LOCALAPPDATA\${{ steps.plan.outputs.packid }}"
          $log = "$env:LOCALAPPDATA\Copilot\logs\copilot.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          function Read-Log {
            try {
              $fs = [IO.File]::Open($log, 'Open', 'Read', 'ReadWrite, Delete')
              try { (New-Object IO.StreamReader($fs)).ReadToEnd() } finally { $fs.Dispose() }
            } catch { "" }
          }
          $app = Start-Process "$root\current\Copilot.exe" -PassThru
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $deadline -and -not $app.HasExited -and
                 (Read-Log) -notmatch "update $([regex]::Escape($new)) downloaded") { Start-Sleep 5 }
          $downloaded = (Read-Log) -match "update $([regex]::Escape($new)) downloaded"

          # Close the window as the user would ("Later", then close): the update installs on exit.
          $null = $app.CloseMainWindow()
          if (-not $app.WaitForExit(60000)) { $app | Stop-Process -Force; throw "Copilot did not close" }
          $deadline = (Get-Date).AddMinutes(3)
          do { Start-Sleep 5 } while ((Get-Date) -lt $deadline -and (Get-Process Update -ErrorAction SilentlyContinue))
          Start-Sleep 5

          $env:COPILOT_HOME = "$env:RUNNER_TEMP\copilot-update-check"
          $t = Start-Process "$root\current\Copilot.exe" -ArgumentList "--self-test" -PassThru
          $null = $t.WaitForExit(180000)
          $build = (Get-Content "$env:COPILOT_HOME\logs\selftest.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json).build
          Read-Log
          Get-Content "$root\velopack.log" -Tail 40 -ErrorAction SilentlyContinue
          if (-not $downloaded) { throw "The previous release did not download $new" }
          if ($build -notlike "$new *") { throw "After closing, the installed version is '$build', expected $new" }
          "Update test passed: $($prev.tag_name) updated itself to $build"
