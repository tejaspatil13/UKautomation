# Render Blueprint: one Docker web service with a persistent disk for the datasets.
services:
  - type: web
    name: copilot
    runtime: docker
    plan: standard           # 2 GB RAM: the monthly Companies House import holds ~5.6M company numbers
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 20             # ~4.5 GB of data + room to build each update beside the old copy
    envVars:
      - key: UKA_DATA_DIR
        value: /data
      - key: UKA_AUTO_IMPORT_ON_START
        value: "true"
      - key: UKA_APP_PASSWORD
        generateValue: true
      - key: UKA_COMPANIES_HOUSE_API_KEY
        sync: false            # set in the dashboard: free key from developer.company-information.service.gov.uk
